
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Submit a Record</title>

<style>
body {
    background: #111318;
    color: #eee;
    font-family: Arial, sans-serif;
    max-width: 600px;
    margin: 45px auto;
    padding: 20px;
}

h1 {
    font-size: 30px;
    margin-bottom: 8px;
}

p {
    color: #999;
    font-size: 14px;
}

form {
    background: #191c23;
    padding: 25px;
    border: 1px solid #2b303b;
    border-radius: 10px;
    margin-top: 25px;
}

label {
    display: block;
    margin: 20px 0 8px;
    font-size: 14px;
    font-weight: bold;
}

input, select, .level-button {
    width: 100%;
    padding: 12px;
    box-sizing: border-box;
    background: #111318;
    color: white;
    border: 1px solid #343a47;
    border-radius: 5px;
    font-size: 14px;
}

input:focus, select:focus, .level-button:focus {
    outline: none;
    border-color: #00bfff;
}

.level-dropdown {
    position: relative;
}

.level-button {
    text-align: left;
    cursor: pointer;
}

.level-menu {
    display: none;
    position: absolute;
    z-index: 5;
    width: 100%;
    margin-top: 5px;
    background: #191c23;
    border: 1px solid #343a47;
    border-radius: 5px;
    overflow: hidden;
}

.level-menu.open {
    display: block;
}

.level-options {
    max-height: 360px;
    overflow-y: auto;
}

.level-option {
    padding: 10px 12px;
    font-size: 13px;
    cursor: pointer;
}

.level-option:hover {
    background: #263747;
}

small {
    display: block;
    color: #999;
    margin-top: 7px;
}

button.submit {
    width: 100%;
    margin-top: 25px;
    padding: 13px;
    background: #00bfff;
    color: #081118;
    border: none;
    border-radius: 5px;
    font-weight: bold;
    cursor: pointer;
}

button.submit:hover {
    background: #55d5ff;
}

button.submit:disabled {
    opacity: 0.6;
    cursor: wait;
}

#status {
    margin-top: 15px;
    line-height: 1.5;
    overflow-wrap: anywhere;
}

#status.success {
    color: #65e6a5;
}

#status.error {
    color: #ff7777;
}

@media (max-width: 650px) {
    body {
        margin: 20px auto;
    }

    form {
        padding: 18px;
    }
}
</style>
</head>

<body>

<h1>Submit a Record</h1>
<p>Fill out the form to submit your completion.</p>

<form id="form">

    <label for="discord">Discord User (@NAME)</label>
    <input id="discord" name="discord" placeholder="@username" required>

    <label for="levelButton">Level</label>
    <div class="level-dropdown">
        <button type="button" class="level-button" id="levelButton">
            Loading levels...
        </button>

        <div class="level-menu" id="levelMenu">
            <input id="levelSearch" placeholder="Search levels..." autocomplete="off">
            <div class="level-options" id="levelOptions"></div>
        </div>

        <input type="hidden" id="level" name="level" required>
    </div>

    <label for="profile">What do you want your profile to be displayed at the list? (Case Sensitive)</label>
    <input id="profile" name="profile" placeholder="Your profile name" required>

    <label for="completion">Completion Link (YouTube Only!)</label>
    <input id="completion" name="completion" type="url"
        placeholder="https://youtube.com/..." required>

    <label for="footage">Raw Footage</label>
    <input id="footage" name="footage" type="url"
        placeholder="Google Drive / Medal / YouTube">
    <small>Required for INSANE DEMONS and above.</small>

    <label for="percent">Percent achieved?</label>
    <select id="percent" name="percent" required>
        <option value="">Select percentage</option>
    </select>

    <label for="fps">What FPS are you playing on?</label>
    <input id="fps" name="fps" type="number" min="1" value="60" required>

    <button class="submit" id="submitButton" type="submit">Submit</button>
    <p id="status" role="status" aria-live="polite"></p>

</form>

<script>
const github =
    "https://raw.githubusercontent.com/mrMonky300/The-Spacebar-List/main/data/";

const form = document.getElementById("form");
const button = document.getElementById("levelButton");
const menu = document.getElementById("levelMenu");
const search = document.getElementById("levelSearch");
const options = document.getElementById("levelOptions");
const levelInput = document.getElementById("level");
const status = document.getElementById("status");
const submitButton = document.getElementById("submitButton");

let levels = [];

for (let i = 1; i <= 100; i++) {
    document.getElementById("percent").add(
        new Option(i + "%", i)
    );
}

function showStatus(message, type = "") {
    status.textContent = message;
    status.className = type;
}

function renderLevels(query = "") {
    options.replaceChildren();

    const filtered = levels.filter(level =>
        `#${level.rank} ${level.name}`
            .toLowerCase()
            .includes(query.toLowerCase())
    );

    if (!filtered.length) {
        options.textContent = "No levels found.";
        return;
    }

    filtered.forEach(level => {
        const item = document.createElement("div");
        item.className = "level-option";
        item.textContent = `[#${level.rank}] ${level.name}`;

        item.onclick = () => {
            levelInput.value = level.name;
            button.textContent = item.textContent;
            menu.classList.remove("open");
            showStatus("");
        };

        options.appendChild(item);
    });
}

button.onclick = () => {
    menu.classList.toggle("open");
    search.value = "";
    renderLevels();

    if (menu.classList.contains("open")) {
        search.focus();
    }
};

search.oninput = () => renderLevels(search.value);

document.addEventListener("click", event => {
    if (!event.target.closest(".level-dropdown")) {
        menu.classList.remove("open");
    }
});

async function loadLevels() {
    try {
        const response = await fetch(github + "_list.json");

        if (!response.ok) {
            throw new Error("Failed to load level list.");
        }

        const entries = await response.json();

        levels = (await Promise.all(
            entries.map(async (entry, index) => {
                const filename =
                    typeof entry === "string" ? entry : entry.name;

                try {
                    const response = await fetch(
                        github + encodeURIComponent(filename) + ".json"
                    );

                    if (!response.ok) return null;

                    const data = await response.json();

                    return {
                        rank: index + 1,
                        name: data.name || filename
                    };
                } catch {
                    return null;
                }
            })
        )).filter(Boolean);

        button.textContent = "Select a level";
        renderLevels();

    } catch (error) {
        console.error(error);
        button.textContent = "Failed to load levels";
    }
}

form.addEventListener("submit", async event => {
    event.preventDefault();

    if (!form.reportValidity()) return;

    const completionUrl =
        document.getElementById("completion").value.trim();

    if (!/^https?:\/\/(www\.)?(youtube\.com|youtu\.be)\//i.test(completionUrl)) {
        showStatus("Please enter a valid YouTube link.", "error");
        return;
    }

    if (!levelInput.value) {
        showStatus("Please select a level.", "error");
        button.focus();
        return;
    }

    const submission = Object.fromEntries(
        new FormData(form).entries()
    );

    submission.discord = submission.discord.trim();
    submission.profile = submission.profile.trim();
    submission.completion = completionUrl;
    submission.footage = submission.footage.trim();
    submission.percent = Number(submission.percent);
    submission.fps = Number(submission.fps);

    submitButton.disabled = true;
    submitButton.textContent = "Submitting...";
    showStatus("Submitting your record...");

    try {
        const response = await fetch("/api/submissions", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(submission)
        });

        const result = await response.json();

        if (!response.ok || !result.success) {
            throw new Error(
                result.error || "Your submission could not be saved."
            );
        }

        showStatus(
            "Your record has been submitted successfully!",
            "success"
        );

        form.reset();
        levelInput.value = "";
        button.textContent = "Select a level";
        menu.classList.remove("open");

    } catch (error) {
        console.error(error);

        showStatus(
            "Submission failed: " + error.message,
            "error"
        );
    } finally {
        submitButton.disabled = false;
        submitButton.textContent = "Submit";
    }
});

loadLevels();
</script>

</body>
</html>
